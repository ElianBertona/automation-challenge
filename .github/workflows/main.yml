name: End-to-End Tests (Strangerlist)

on:
  push:
    branches: [ main ]

permissions:
    contents: read
    checks: write        

jobs:
  automation-suite:
    name: "Strangerlist Suite: Desktop & Mobile"
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run Automated Tests (Docker Compose)
        run: |
              docker compose up --build --exit-code-from automation-tests

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webdriverio-reports
          path: |
            reports/
            errorShots/
          if-no-files-found: warn
          retention-days: 5
  
      - name: E2E Detailed Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: "E2E Details: Desktop vs Mobile"
          path: reports/*.xml
          reporter: java-junit    

      - name: Add Visual Summary
        if: always()
        run: |
          echo "## TEST AUTOMATION RESULTS" >> $GITHUB_STEP_SUMMARY
          
          if [ -d "errorShots" ] && [ "$(ls -A errorShots)" ]; then
            echo "### ❌ Status: FAILURES DETECTED" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ✅ Status: ALL PASSED" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "| Platform | Test Case Name | Duration | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|----------------|----------|--------|" >> $GITHUB_STEP_SUMMARY
          
          for file in reports/*.xml; do
            if [[ $file == *"Desktop"* ]]; then
              PLATFORM="💻 Desktop"
            else
              PLATFORM="📱 Mobile"
            fi
          
            grep "<testcase " "$file" | while read -r line; do
              NAME=$(echo $line | sed -E 's/.*name="([^"]*)".*/\1/')
              TIME=$(echo $line | sed -E 's/.*time="([^"]*)".*/\1/')
              echo "| $PLATFORM | $NAME | ${TIME}s | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
            done
          done