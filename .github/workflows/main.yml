name: End-to-End & Quality Suite

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  automation-suite:
    name: "Strangerlist Test Suite"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint . || echo "Lint errors found but continuing for testing"

      - name: Prepare Workspace
        run: |
          mkdir -p reports/junit-results
          mkdir -p errorShots
          chmod -R 777 reports/ errorShots/

      - name: Run E2E Tests
        run: |
          docker compose up --build --exit-code-from automation-tests
        env:
          SPEC_PATH: "./test/specs/e2e/**/*.js"

      - name: Run Performance Audit
        if: always()
        run: |
          docker compose run automation-tests npx wdio run wdio.conf.js --spec ./test/specs/performance/**/*.js
        continue-on-error: true

      - name: File Permissions
        if: always()
        run: sudo chmod -R 777 reports/ errorShots/ || true

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-execution-artifacts
          path: |
            reports/
            errorShots/

      - name: Extract Results from Docker
        if: always()
        run: |
          CONTAINER_ID=$(docker ps -a -q --filter "ancestor=automation-challenge-automation-tests" | head -n 1)
          if [ -z "$CONTAINER_ID" ]; then CONTAINER_ID=$(docker ps -a -q | head -n 1); fi
          
          echo "Extrayendo desde: $CONTAINER_ID"
          mkdir -p /tmp/docker_reports
          docker cp $CONTAINER_ID:/app/reports/. /tmp/docker_reports/
          sudo chown -R $USER:$USER /tmp/docker_reports/
          cp -r /tmp/docker_reports/* ./reports/ || true
          ls -R reports/junit-results/
        continue-on-error: true

      - name: 📊 Generate Integrated Quality Summary
        if: always()
        run: |
          cat << 'EOF' > temp_report.py
          import xml.etree.ElementTree as ET
          import os
          import re

          report_path = 'reports/junit-results'
          summary_file = os.environ.get('GITHUB_STEP_SUMMARY')
          
          tables = {'E2E_Desk': [], 'E2E_Mobi': [], 'Perf_Desk': [], 'Perf_Mobi': []}
          failures = []
          total_tests, passed_tests, total_duration = 0, 0, 0.0

          if os.path.exists(report_path):
              for file in [f for f in os.listdir(report_path) if f.endswith('.xml')]:
                  try:
                      is_mobi = 'Mobile' in file
                      is_perf = 'Perf' in file or 'performance' in file.lower()
                      plat_icon = '📱 Mobile' if is_mobi else '💻 Desktop'
                      key = ('Perf' if is_perf else 'E2E') + ('_Mobi' if is_mobi else '_Desk')

                      tree = ET.parse(os.path.join(report_path, file))
                      root = tree.getroot()
                      suites = root.findall('.//testsuite') if root.tag == 'testsuites' else [root]
                      
                      for suite in suites:
                          for tc in suite.findall('testcase'):
                              name = tc.get('name', '')
                              if not is_perf and ('performance' in name.lower() or 'score' in name.lower()):
                                  continue

                              total_tests += 1
                              duration = float(tc.get('time', 0))
                              total_duration += duration
                              
                              system_out = tc.find('system-out')
                              logs = system_out.text if system_out is not None else ''
                              clean_name = name.split('.')[-1] if '.' in name else name
                              if 'PERFORMANCE SCORE' in logs:
                                  score_match = re.search(r'PERFORMANCE SCORE: (\d+)', logs)
                                  if score_match: clean_name = f'🚀 Audit Score: {score_match.group(1)}/100'

                              is_fail = tc.find('failure') is not None
                              if not is_fail: passed_tests += 1
                              status = '✅ Pass' if not is_fail else '❌ Fail'
                              
                              tables[key].append({'name': clean_name, 'time': f'{duration:.2f}s', 'status': status, 'details': logs})
                              
                              if is_fail:
                                  failures.append({'plat': plat_icon, 'name': clean_name, 'msg': tc.find('failure').text[:500] if tc.find('failure').text else 'Error'})
                  except Exception as e:
                      print(f'Error procesando {file}: {e}')

          success_rate = (passed_tests / total_tests * 100) if total_tests > 0 else 0

          with open(summary_file, 'a') as f:
              f.write('# 🚀 QA ENGINEERING DASHBOARD\n\n')
              f.write('## 📈 System Health & DORA Metrics\n')
              f.write('| KPI | Value | Status |\n| :--- | :--- | :--- |\n')
              f.write('| **Quality Gate** | {:.1f}% | {} |\n'.format(success_rate, '🟢 Healthy' if success_rate > 95 else '🔴 Risk'))
              f.write('| **Cycle Time** | {:.2f}s | {} |\n'.format(total_duration, '⚡ Optimized' if total_duration < 120 else '🕒 Warning'))
              f.write('| **Readiness** | Ready for Release | {} |\n\n'.format('🚀 APPROVED' if success_rate == 100 else '🛑 BLOCKED'))

              for plat_label, k in [('💻 DESKTOP', 'E2E_Desk'), ('📱 MOBILE', 'E2E_Mobi'), ('🚀 PERF DESKTOP', 'Perf_Desk'), ('🚀 PERF MOBILE', 'Perf_Mobi')]:
                  if tables[k]:
                      f.write(f'### {plat_label}\n')
                      f.write('| Test Case | Time | Status |\n| :--- | :--- | :--- |\n')
                      for r in tables[k]: f.write('| {} | {} | {} |\n'.format(r['name'], r['time'], r['status']))
                      f.write('\n')
              f.write('## 🔬 Performance Deep Dive\n')
              f.write('<details><summary>Click to view Core Web Vitals</summary>\n\n')
              
              found_any_metric = False
              for k in ['Perf_Desk', 'Perf_Mobi', 'E2E_Desk', 'E2E_Mobi']:
                  for p in tables[k]:
                      # Buscamos LCP, TBT o CLS en cualquier parte del log
                      metric_lines = re.findall(r'(LCP: .*|TBT: .*|CLS: .*|Métricas: .*)', p['details'])
                      if metric_lines:
                          found_any_metric = True
                          f.write(f'#### Metrics for {p["name"]}\n```text\n')
                          for line in metric_lines: f.write(f'{line}\n')
                          f.write('```\n')
              
              if not found_any_metric:
                  f.write('*No se encontraron métricas detalladas en los logs de los tests.*\n')
              
              f.write('</details>\n\n')

              if failures:
                  f.write('## 🔍 Failure Analysis\n')
                  for fl in failures: f.write('<details><summary>❌ {} - {}</summary>\n\n```text\n{}\n```\n</details>\n'.format(fl['plat'], fl['name'], fl['msg']))
          EOF
          python3 temp_report.py
        continue-on-error: true