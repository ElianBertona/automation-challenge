name: End-to-End & Quality Suite

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  automation-suite:
    name: "Strangerlist Test Suite"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint . || echo "Lint errors found but continuing for testing"

      - name: Prepare Workspace
        run: |
          mkdir -p reports/junit-results
          mkdir -p errorShots
          chmod -R 777 reports/ errorShots/

      - name: Run E2E Tests
        run: |
          docker compose up --build --exit-code-from automation-tests
        env:
          SPEC_PATH: "./test/specs/e2e/**/*.js"

      - name: Run Performance Audit
        if: always()
        run: |
          docker compose run automation-tests npx wdio run wdio.conf.js --spec ./test/specs/performance/**/*.js
        continue-on-error: true

      - name: File Permissions
        if: always()
        run: sudo chmod -R 777 reports/ errorShots/ || true

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-execution-artifacts
          path: |
            reports/
            errorShots/

      - name: 📤 Extract Results from Docker (Bypass de Permisos)
        if: always()
        run: |
          CONTAINER_ID=$(docker ps -a -q --filter "ancestor=automation-challenge-automation-tests" | head -n 1)
          if [ -z "$CONTAINER_ID" ]; then CONTAINER_ID=$(docker ps -a -q | head -n 1); fi
          
          echo "Extrayendo desde: $CONTAINER_ID"
          
          # 1. Creamos una carpeta temporal limpia fuera de nuestro workspace
          mkdir -p /tmp/docker_reports
          
          # 2. Copiamos los archivos de Docker ahí (Docker no se quejará)
          docker cp $CONTAINER_ID:/app/reports/. /tmp/docker_reports/
          
          # 3. Nos hacemos dueños absolutos de esos archivos (runner es el usuario de GitHub)
          sudo chown -R $USER:$USER /tmp/docker_reports/
          
          # 4. Ahora que son nuestros, los movemos a nuestra carpeta final
          cp -r /tmp/docker_reports/* ./reports/ || true
          
          # Verificamos que los XML (con las métricas dentro) estén ahí
          ls -R reports/junit-results/
        continue-on-error: true

      - name: Generate Integrated Quality Summary
        if: always()
        run: |
          python3 -c "
          import xml.etree.ElementTree as ET
          import os
          import re

          report_path = 'reports/junit-results'
          summary_file = os.environ.get('GITHUB_STEP_SUMMARY')
          
          tables = {'E2E_Desk': [], 'E2E_Mobi': [], 'Perf_Desk': [], 'Perf_Mobi': []}
          failures = []
          total_tests, passed_tests, total_duration = 0, 0, 0.0

          if os.path.exists(report_path):
              for file in [f for f in os.listdir(report_path) if f.endswith('.xml')]:
                  try:
                      is_mobi = 'Mobile' in file
                      is_perf = 'Perf' in file or 'performance' in file.lower()
                      plat_icon = '📱 Mobile' if is_mobi else '💻 Desktop'
                      key = ('Perf' if is_perf else 'E2E') + ('_Mobi' if is_mobi else '_Desk')

                      tree = ET.parse(os.path.join(report_path, file))
                      root = tree.getroot()
                      suites = root.findall('.//testsuite') if root.tag == 'testsuites' else [root]
                      
                      for suite in suites:
                          for tc in suite.findall('testcase'):
                              name = tc.get('name', '')
                              
                              if not is_perf and ('performance' in name.lower() or 'score' in name.lower()):
                                  continue

                              total_tests += 1
                              duration = float(tc.get('time', 0))
                              total_duration += duration
                              
                              system_out = tc.find('system-out')
                              logs = system_out.text if system_out is not None else ''
                              
                              clean_name = name.split('.')[-1] if '.' in name else name
                              if 'Overall Performance Score' in clean_name or 'Analysis' in clean_name:
                                  clean_name = '🚀 Lighthouse Audit'

                              if is_perf and 'PERFORMANCE SCORE' in logs:
                                  score_match = re.search(r'PERFORMANCE SCORE: (\d+/\d+)', logs)
                                  if score_match: clean_name = f'🚀 Audit Score: {score_match.group(1)}'

                              is_fail = tc.find('failure') is not None
                              if not is_fail: passed_tests += 1
                              status = '✅ Pass' if not is_fail else '❌ Fail'
                              
                              tables[key].append({'name': clean_name, 'time': f'{duration:.2f}s', 'status': status, 'details': logs})
                              
                              if is_fail:
                                  failures.append({'plat': plat_icon, 'name': clean_name, 'msg': tc.find('failure').text[:500] if tc.find('failure').text else 'Error'})
                  except: pass

          success_rate = (passed_tests / total_tests * 100) if total_tests > 0 else 0

          with open(summary_file, 'a') as f:
              f.write('# 🚀 QA ENGINEERING DASHBOARD\n\n')
              f.write('## 📈 System Health & DORA Metrics\n')
              f.write('| Key Performance Indicator | Value | Status |\n| :--- | :--- | :--- |\n')
              # Usamos comillas simples para los f-strings de Python dentro del bloque run para evitar conflictos
              f.write('| **Quality Gate (Success Rate)** | {:.1f}% | {} |\n'.format(success_rate, '🟢 Healthy' if success_rate > 95 else '🔴 Risk'))
              f.write('| **Cycle Time (Execution)** | {:.2f}s | {} |\n'.format(total_duration, '⚡ Optimized' if total_duration < 120 else '🕒 Warning'))
              f.write('| **Reliability Index** | {}/{} Passed | {} |\n'.format(passed_tests, total_tests, '🛡️ Stable' if success_rate == 100 else '⚠️ Unstable'))
              f.write('| **Deployment Readiness** | Ready for Release | {} |\n\n'.format('🚀 APPROVED' if success_rate == 100 else '🛑 BLOCKED'))

              for plat_label, k in [('💻 DESKTOP', 'E2E_Desk'), ('📱 MOBILE', 'E2E_Mobi')]:
                  if tables[k]:
                      f.write('### {} - FUNCTIONAL E2E\n'.format(plat_label))
                      f.write('| Test Case | Duration | Status |\n| :--- | :--- | :--- |\n')
                      for r in tables[k]: f.write('| {} | {} | {} |\n'.format(r['name'], r['time'], r['status']))
                      f.write('\n')

              for plat_label, k in [('💻 DESKTOP', 'Perf_Desk'), ('📱 MOBILE', 'Perf_Mobi')]:
                  if tables[k]:
                      f.write('### {} - QUALITY AUDIT\n'.format(plat_label))
                      f.write('| Metric / Audit | Score/Time | Status |\n| :--- | :--- | :--- |\n')
                      for r in tables[k]: f.write('| {} | {} | {} |\n'.format(r['name'], r['time'], r['status']))
                      f.write('\n')

              if any(tables['Perf_Desk']) or any(tables['Perf_Mobi']):
                  f.write('## 🔬 Performance Deep Dive\n')
                  f.write('<details><summary>Click to view Core Web Vitals (LCP, TBT, CLS)</summary>\n\n')
                  for k in ['Perf_Desk', 'Perf_Mobi']:
                      for p in tables[k]:
                          if 'METRICS_START' in p['details']:
                              m_text = p['details'].split('METRICS_START')[1].split('METRICS_END')[0]
                              f.write('#### {} Metrics\n```text\n{}\n```\n'.format(k.replace('_', ' '), m_text.strip()))
                  f.write('</details>\n\n')

              if failures:
                  f.write('## 🔍 Failure Analysis\n')
                  for fl in failures: f.write('<details><summary>❌ {} - {}</summary>\n\n```text\n{}\n```\n</details>\n'.format(fl['plat'], fl['name'], fl['msg']))
          ""
        continue-on-error: true