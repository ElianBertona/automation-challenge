name: End-to-End & Quality Suite

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  automation-suite:
    name: "Strangerlist Test Suite"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint . || echo "Lint errors found but continuing for testing"

      - name: Prepare Workspace
        run: |
          mkdir -p reports/junit-results
          mkdir -p errorShots
          chmod -R 777 reports/ errorShots/

      - name: Run E2E Tests
        run: |
          docker compose up --build --exit-code-from automation-tests
        env:
          SPEC_PATH: "./test/specs/e2e/**/*.js"

      - name: Run Performance Audit
        if: always()
        run: |
          docker compose run automation-tests npx wdio run wdio.conf.js --spec ./test/specs/performance/**/*.js
        continue-on-error: true

      - name: File Permissions
        if: always()
        run: sudo chmod -R 777 reports/ errorShots/ || true

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-execution-artifacts
          path: |
            reports/
            errorShots/

      - name: 📊 Generate Integrated Quality Summary
        if: always()
        run: |
          python3 -c "
          import xml.etree.ElementTree as ET
          import os
          import re
          from datetime import datetime

          report_path = 'reports/junit-results'
          summary_file = os.environ.get('GITHUB_STEP_SUMMARY')
          
          tables = {'E2E_Desk': [], 'E2E_Mobi': [], 'Perf_Desk': [], 'Perf_Mobi': []}
          failures = []
          total_tests = 0
          passed_tests = 0
          total_duration = 0.0

          if os.path.exists(report_path):
              for file in [f for f in os.listdir(report_path) if f.endswith('.xml')]:
                  try:
                      is_mobi = 'Mobile' in file
                      is_perf = 'Perf' in file
                      plat_icon = '📱 Mobile' if is_mobi else '💻 Desktop'
                      key = ('Perf' if is_perf else 'E2E') + ('_Mobi' if is_mobi else '_Desk')

                      tree = ET.parse(os.path.join(report_path, file))
                      root = tree.getroot()
                      suites = root.findall('.//testsuite') if root.tag == 'testsuites' else [root]
                      
                      for suite in suites:
                          for tc in suite.findall('testcase'):
                              total_tests += 1
                              name = tc.get('name', '')
                              clean_name = name.split('.')[-1] if '.' in name else name
                              
                              duration = float(tc.get('time', 0))
                              total_duration += duration
                              
                              system_out = tc.find('system-out')
                              logs = system_out.text if system_out is not None else ''
                              
                              if is_perf and 'PERFORMANCE SCORE' in logs:
                                  score_match = re.search(r'PERFORMANCE SCORE: (\d+)', logs)
                                  if score_match: clean_name = f'🚀 Overall Score: {score_match.group(1)}/100'

                              is_fail = tc.find('failure') is not None
                              if not is_fail: passed_tests += 1
                              status = '❌ Fail' if is_fail else '✅ Pass'
                              
                              tables[key].append({'name': clean_name, 'time': f'{duration:.2f}s', 'status': status, 'details': logs})
                              if is_fail:
                                  failures.append({'plat': plat_icon, 'name': clean_name, 'msg': tc.find('failure').text[:500] if tc.find('failure').text else 'Error'})
                  except: pass

          success_rate = (passed_tests / total_tests * 100) if total_tests > 0 else 0

          with open(summary_file, 'a') as f:
              f.write('# 🚀 QA ENGINEERING DASHBOARD\n\n')
              
              # --- MINI-INSIGHTS PANEL (DORA LITE) ---
              f.write('## 📈 Pipeline Health Insights\n')
              f.write(f'| Metric | Value | Status |\n| :--- | :--- | :--- |\n')
              f.write(f'| **Success Rate** | {success_rate:.1f}% | {\"🟢 Healthy\" if success_rate > 90 else \"🔴 Action Required\"} |\n')
              f.write(f'| **Total Test Duration** | {total_duration:.2f}s | {\"⚡ Fast\" if total_duration < 60 else \"🕒 Moderate\"} |\n')
              f.write(f'| **Lead Time Context** | Ready for Deploy | {\"✅ Optimized\" if success_rate == 100 else \"⚠️ Risk Detected\"} |\n\n')

              # --- TABLAS DE RESULTADOS ---
              sections = [
                  ('💻 DESKTOP - E2E', 'E2E_Desk', '| Test Case | Duration | Status |'),
                  ('📱 MOBILE - E2E', 'E2E_Mobi', '| Test Case | Duration | Status |'),
                  ('⚡ DESKTOP - PERFORMANCE', 'Perf_Desk', '| Metric / Audit | Score/Time | Status |'),
                  ('⚡ MOBILE - PERFORMANCE', 'Perf_Mobi', '| Metric / Audit | Score/Time | Status |')
              ]

              for title, key, header in sections:
                  if tables[key]:
                      f.write(f'### {title}\n{header}\n| :--- | :--- | :--- |\n')
                      for r in tables[key]: f.write(f'| {r[\"name\"]} | {r[\"time\"]} | {r[\"status\"]} |\n')
                      f.write('\n')

              if any(tables['Perf_Desk']) or any(tables['Perf_Mobi']):
                  f.write('## 🔬 Performance Technical Logs\n<details><summary>Click to expand Lighthouse metrics</summary>\n')
                  for k in ['Perf_Desk', 'Perf_Mobi']:
                      for p in tables[k]:
                          if p['details']: f.write(f'#### {k}\\n```text\\n{p[\"details\"]}\\n```\\n')
                  f.write('</details>\n\n')

              if failures:
                  f.write('## 🔍 Failure Analysis\n')
                  for fl in failures: f.write(f'<details><summary>❌ {fl[\"plat\"]} - {fl[\"name\"]}</summary>\\n\\n```text\\n{fl[\"msg\"]}\\n```\\n</details>\\n')
          "
