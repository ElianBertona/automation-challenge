name: End-to-End Tests (Strangerlist)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  automation-suite:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run Automated Tests (Docker Compose)
        run: |
              docker compose up --build --exit-code-from automation-tests

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webdriverio-reports
          path: |
            reports/
            errorShots/
          retention-days: 5