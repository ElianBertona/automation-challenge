name: End-to-End Tests

on:
  push:
    branches: [ main ]

permissions:
    contents: read
    checks: write        

jobs:
  automation-suite:
    name: "Strangerlist Test Suite"
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run Automated Tests (Docker Compose)
        run: |
              docker compose up --build --exit-code-from automation-tests

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-and-screenshots
          path: |
            reports/
            errorShots/
          if-no-files-found: ignore
          retention-days: 5
  
      - name: Generate Report Summary
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: "Detailed Test Results: Desktop & Mobile"
          path: reports/*.xml
          reporter: java-junit   
          fail-on-error: false 

      - name: Add Visual Summary
        if: always()
        run: |
          echo "# TEST AUTOMATION RESULTS" >> $GITHUB_STEP_SUMMARY
          
          if [ -d "errorShots" ] && [ "$(ls -A errorShots)" ]; then
            echo "### ❌ Status: FAILURES DETECTED" >> $GITHUB_STEP_SUMMARY
            echo "> **Note:** You can download the screenshots from the **Artifacts** section at the bottom of this page." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ✅ Status: ALL PASSED" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "## Execution Details" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Test Case Name | Duration | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          python3 -c "
          import xml.etree.ElementTree as ET
          import os

          for file in sorted(os.listdir('reports')):
              if file.endswith('.xml'):
                  platform = file.replace('results-', '').replace('.xml', '')
                  tree = ET.parse(f'reports/{file}')
                  root = tree.getroot()
                  suites = root.findall('.//testsuite') if root.tag == 'testsuites' else [root]
                  for suite in suites:
                      for tc in suite.findall('testcase'):
                          name = tc.get('name')
                          time = tc.get('time')
                          failure = tc.find('failure')
                          status = '❌ Failed' if failure is not None else '✅ Passed'
                          print(f'| {platform} | {name} | {time}s | {status} |')
          " >> $GITHUB_STEP_SUMMARY