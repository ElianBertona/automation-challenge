name: End-to-End Tests (Strangerlist)

on:
  push:
    branches: [ main ]

permissions:
    contents: read
    checks: write        

jobs:
  automation-suite:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run Automated Tests (Docker Compose)
        run: |
              docker compose up --build --exit-code-from automation-tests

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webdriverio-reports
          path: |
            reports/
            errorShots/
          if-no-files-found: warn
          retention-days: 5
  
      - name: Test Report Check
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: E2E Test Results
          path: reports/*.xml
          reporter: java-junit    

      - name: Add Visual Summary
        if: always()
        run: |
          echo "## 🚀 TEST AUTOMATION RESULTS" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ General Status" >> $GITHUB_STEP_SUMMARY
          
          if [ -d "errorShots" ] && [ "$(ls -A errorShots)" ]; then
            echo "❌ **Failures detected.** Please check the screenshots in the Artifacts section at the bottom." >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **All tests passed successfully!**" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "### 📝 Test Case Details" >> $GITHUB_STEP_SUMMARY
          echo "| Test Case Name | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------------|--------|" >> $GITHUB_STEP_SUMMARY
          
          # This command extracts test names from your XML files and adds them to the GitHub table
          grep "testcase" reports/*.xml | sed -E 's/.*name="([^"]*)".*/| \1 | ✅ Passed |/' >> $GITHUB_STEP_SUMMARY