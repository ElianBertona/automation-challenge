name: End-to-End Tests

on:
  push:
    branches: [main, feature/qa-ecosystem]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  automation-suite:
    name: "Strangerlist Test Suite"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache Node.js modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare Workspace
        run: |
          mkdir -p reports/json-results
          mkdir -p errorShots
          rm -rf reports/*
          rm -rf errorShots/*

      - name: Run Automated Tests (Docker Compose)
        run: |
          docker compose up --build --exit-code-from automation-tests

      - name: Fix File Permissions
        if: always()
        run: sudo chmod -R 777 reports/ errorShots/ || true

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-and-screenshots
          path: |
            reports/
            errorShots/
          if-no-files-found: ignore
          retention-days: 5

      - name: Generate Report Summary
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: "Detailed Test Results: Desktop & Mobile"
          path: reports/junit-results/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Add Visual Summary
        if: always()
        run: |
          echo "# 🚀 TEST AUTOMATION RESULTS" >> $GITHUB_STEP_SUMMARY

          if [ -d "errorShots" ] && [ "$(ls -A errorShots)" ]; then
            echo "### ❌ Status: FAILURES DETECTED" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ✅ Status: ALL PASSED" >> $GITHUB_STEP_SUMMARY
          fi

          echo "## 📊 Detailed Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Type | Test Case | Duration | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          
          python3 -c "
          import xml.etree.ElementTree as ET
          import os

          report_path = 'reports/junit-results'
          results = []

          if os.path.exists(report_path):
              files = [f for f in os.listdir(report_path) if f.endswith('.xml')]
              for file in files:
                  platform = '📱 Mobile' if 'Mobile' in file else '💻 Desktop'
                  try:
                      tree = ET.parse(f'{report_path}/{file}')
                      root = tree.getroot()
                      suites = root.findall('.//testsuite') if root.tag == 'testsuites' else [root]
                      for suite in suites:
                          suite_name = suite.get('name', '')
                          test_type = '⚡ Perf' if 'Performance' in suite_name or 'performance' in file else '🛠️ E2E'
                          
                          for tc in suite.findall('testcase'):
                              name = tc.get('name')
                              time = tc.get('time')
                              failure = tc.find('failure')
                              status = '❌ Failed' if failure is not None else '✅ Passed'
                              # Guardamos en lista para ordenar
                              results.append({
                                  'platform': platform,
                                  'type': test_type,
                                  'name': name,
                                  'time': time,
                                  'status': status,
                                  'priority': 1 if test_type == '🛠️ E2E' else 2
                              })
                  except Exception:
                      pass
              
              results.sort(key=lambda x: (x['priority'], x['platform']))
              
              for r in results:
                  print(f'| {r[\"platform\"]} | {r[\"type\"]} | {r[\"name\"]} | {r[\"time\"]}s | {r[\"status\"]} |')
          " >> $GITHUB_STEP_SUMMARY

      - name: Generate Quality Dashboard 
        if: always()
        run: node scripts/generate_report.js
