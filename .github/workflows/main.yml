name: End-to-End & Quality Suite

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  automation-suite:
    name: "Strangerlist Test Suite"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint . || echo "Lint errors found but continuing for testing"

      - name: Prepare Workspace
        run: |
          mkdir -p reports/junit-results
          mkdir -p errorShots
          chmod -R 777 reports/ errorShots/

      - name: Run E2E Tests
        run: |
          docker compose up --build --exit-code-from automation-tests
        env:
          SPEC_PATH: "./test/specs/e2e/**/*.js"

      - name: Run Performance Audit
        if: always()
        run: |
          docker compose run automation-tests npx wdio run wdio.conf.js --spec ./test/specs/performance/**/*.js
        continue-on-error: true

      - name: File Permissions
        if: always()
        run: sudo chmod -R 777 reports/ errorShots/ || true

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-execution-artifacts
          path: |
            reports/
            errorShots/

      - name: 📊 Generate Integrated Quality Summary
        if: always()
        run: |
          python3 -c "
          import xml.etree.ElementTree as ET
          import os
          import re

          report_path = 'reports/junit-results'
          summary_file = os.environ.get('GITHUB_STEP_SUMMARY')

          # Estructura para 4 tablas separadas
          tables = {
              'E2E_Desk': [], 'E2E_Mobi': [],
              'Perf_Desk': [], 'Perf_Mobi': []
          }
          failures = []

          if os.path.exists(report_path):
              files = [f for f in os.listdir(report_path) if f.endswith('.xml')]
              for file in files:
                  try:
                      # Detectar plataforma y tipo por nombre de archivo
                      is_mobi = 'Mobile' in file
                      is_perf = 'Perf' in file
                      plat_icon = '📱 Mobile' if is_mobi else '💻 Desktop'
                      key = ('Perf' if is_perf else 'E2E') + ('_Mobi' if is_mobi else '_Desk')

                      tree = ET.parse(os.path.join(report_path, file))
                      root = tree.getroot()
                      suites = root.findall('.//testsuite') if root.tag == 'testsuites' else [root]
                      
                      for suite in suites:
                          for tc in suite.findall('testcase'):
                              name = tc.get('name', '')
                              # Limpiar nombres técnicos de WDIO
                              clean_name = name.split('.')[-1] if '.' in name else name
                              
                              # Extraer logs (aquí vienen los detalles de Performance como LCP, Score, etc.)
                              system_out = tc.find('system-out')
                              logs = system_out.text if system_out is not None else ''
                              
                              # Si es performance, intentamos embellecer el nombre con el Score si existe en los logs
                              if is_perf and 'PERFORMANCE SCORE' in logs:
                                  score_match = re.search(r'PERFORMANCE SCORE: (\d+)', logs)
                                  if score_match:
                                      clean_name = f'🚀 Overall Score: {score_match.group(1)}/100'

                              status = '✅ Pass' if tc.find('failure') is None else '❌ Fail'
                              
                              tables[key].append({
                                  'name': clean_name,
                                  'time': f'{float(tc.get(\"time\", 0)):.2f}s',
                                  'status': status,
                                  'details': logs # Guardamos logs para el Deep Dive
                              })

                              if tc.find('failure') is not None:
                                  failures.append({
                                      'plat': plat_icon,
                                      'name': clean_name,
                                      'msg': tc.find('failure').text[:500] if tc.find('failure').text else 'Check logs'
                                  })
                  except Exception as e:
                      print(f'Error procesando {file}: {e}')

          with open(summary_file, 'a') as f:
              f.write('# 🚀 QUALITY ASSURANCE EXECUTIVE REPORT\n\n')

              sections = [
                  ('💻 DESKTOP - FUNCTIONAL E2E', 'E2E_Desk', '| Test Case | Duration | Status |'),
                  ('📱 MOBILE - FUNCTIONAL E2E', 'E2E_Mobi', '| Test Case | Duration | Status |'),
                  ('⚡ DESKTOP - PERFORMANCE AUDIT', 'Perf_Desk', '| Metric / Audit | Value/Time | Status |'),
                  ('⚡ MOBILE - PERFORMANCE AUDIT', 'Perf_Mobi', '| Metric / Audit | Value/Time | Status |')
              ]

              for title, key, header in sections:
                  if tables[key]:
                      f.write(f'## {title}\n')
                      f.write(f'{header}\n| :--- | :--- | :--- |\n')
                      for r in tables[key]:
                          f.write(f'| {r[\"name\"]} | {r[\"time\"]} | {r[\"status\"]} |\n')
                      f.write('\n')

              # SECCIÓN DE DETALLES TÉCNICOS (Aquí es donde verás LCP, CLS, etc.)
              if tables['Perf_Desk'] or tables['Perf_Mobi']:
                  f.write('## 📈 TECHNICAL PERFORMANCE DETAILS\n')
                  f.write('<details><summary>Click to view Lighthouse Metrics (LCP, TBT, CLS)</summary>\n\n')
                  for p_key in ['Perf_Desk', 'Perf_Mobi']:
                      for p_res in tables[p_key]:
                          if p_res['details']:
                              f.write(f'### Metrics for {p_key.replace(\"_\", \" \")}\n')
                              f.write(f'```text\n{p_res[\"details\"]}\n```\n')
                  f.write('</details>\n\n')

              if failures:
                  f.write('## 🔍 FAILURE ANALYSIS\n')
                  for fl in failures:
                      f.write(f'<details><summary>❌ {fl[\"plat\"]} - {fl[\"name\"]}</summary>\n\n```text\n{fl[\"msg\"]}\n```\n</details>\n')
          "
