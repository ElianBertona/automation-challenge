name: End-to-End Tests (Strangerlist)

on:
  push:
    branches: [ main ]

permissions:
    contents: read
    checks: write        

jobs:
  automation-suite:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run Automated Tests (Docker Compose)
        run: |
              docker compose up --build --exit-code-from automation-tests

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webdriverio-reports
          path: |
            reports/
            errorShots/
          if-no-files-found: warn
          retention-days: 5
  
      - name: Test Report Check
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: E2E Test Results
          path: reports/*.xml
          reporter: java-junit          