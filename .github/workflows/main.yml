name: End-to-End & Quality Suite

on:
  push:
    branches: [main, feature/qa-ecosystem]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  automation-suite:
    name: "Strangerlist Test Suite"
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # --- GATE 1: STATIC ANALYSIS ---
      - name: Run ESLint
        run: npx eslint . || echo "Lint errors found but continuing for testing"

      - name: Prepare Workspace
        run: |
          mkdir -p reports/junit-results
          mkdir -p errorShots
          chmod -R 777 reports/ errorShots/

      # --- GATE 2: E2E TESTS (FOLDER BASED) ---
      - name: Run E2E Tests
        run: |
          docker compose up --build --exit-code-from automation-tests
        env:
          # WDIO usará esta variable para filtrar la carpeta
          SPEC_PATH: "./test/specs/e2e/**/*.js"

      # --- GATE 3: PERFORMANCE AUDIT ---
      - name: Run Performance Audit
        if: always()
        run: |
          docker compose run automation-tests npx wdio run wdio.conf.js --spec ./test/specs/performance/**/*.js
        continue-on-error: true

      - name: Fix File Permissions (Post-Docker)
        if: always()
        run: sudo chmod -R 777 reports/ errorShots/ || true

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-execution-artifacts
          path: |
            reports/
            errorShots/

      # --- FINAL GATE: INTEGRATED SUMMARY ---
      - name: 📊 Generate Integrated Quality Summary
        if: always()
        run: |
          python3 -c "
          import xml.etree.ElementTree as ET
          import os

          report_path = 'reports/junit-results'
          summary_file = os.environ.get('GITHUB_STEP_SUMMARY')
          e2e_res, perf_res, failures = [], [], []

          if os.path.exists(report_path):
              for file in [f for f in os.listdir(report_path) if f.endswith('.xml')]:
                  try:
                      # Verificamos si el archivo tiene contenido antes de parsear
                      if os.path.getsize(os.path.join(report_path, file)) == 0: continue
                      
                      tree = ET.parse(os.path.join(report_path, file))
                      root = tree.getroot()
                      suites = root.findall('.//testsuite') if root.tag == 'testsuites' else [root]
                      
                      plat = '💻 Desk' if 'Desktop' in file else '📱 Mobi'
                      for suite in suites:
                          is_p = 'perf' in file.lower() or 'perf' in suite.get('name','').lower()
                          for tc in suite.findall('testcase'):
                              item = {
                                  'plat': plat,
                                  'name': tc.get('name')[:50],
                                  'time': f'{float(tc.get(\"time\", 0)):.2f}s',
                                  'status': '❌ Fail' if tc.find('failure') is not None else '✅ Pass'
                              }
                              if tc.find('failure') is not None:
                                  failures.append({'p': plat, 'n': item['name'], 'm': tc.find('failure').text[:300] if tc.find('failure').text else 'Error'})
                              if is_p: perf_res.append(item)
                              else: e2e_res.append(item)
                  except Exception as e: print(f'Skip {file}: {e}')

          with open(summary_file, 'a') as f:
              f.write('# 🚀 QUALITY EXECUTIVE REPORT\n\n')
              if e2e_res:
                  f.write('## 🛠️ Functional E2E\n| Plat | Test Case | Dur | Status |\n|:---|:---|:---|:---|\n')
                  for r in e2e_res: f.write(f'| {r[\"plat\"]} | {r[\"name\"]} | {r[\"time\"]} | {r[\"status\"]} |\n')
              if perf_res:
                  f.write('\n## ⚡ Performance Audit\n| Plat | Audit | Score/Time | Status |\n|:---|:---|:---|:---|\n')
                  for r in perf_res: f.write(f'| {r[\"plat\"]} | {r[\"name\"]} | {r[\"time\"]} | {r[\"status\"]} |\n')
              if failures:
                  f.write('\n## 🔍 Failure Details\n')
                  for fl in failures: f.write(f'<details><summary>❌ {fl[\"p\"]} - {fl[\"n\"]}</summary>\n\n```text\n{fl[\"m\"]}\n```\n</details>\n')
          "