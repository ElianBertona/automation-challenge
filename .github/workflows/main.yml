name: End-to-End Tests

on:
  push:
    branches: [ main ]

permissions:
    contents: read
    checks: write        

jobs:
  automation-suite:
    name: "Strangerlist Test Suite"
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run Automated Tests (Docker Compose)
        run: |
              docker compose up --build --exit-code-from automation-tests

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webdriverio-reports
          path: |
            reports/
            errorShots/
          if-no-files-found: warn
          retention-days: 5
  
      - name: Generate Report Summary
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: "Details Results: Desktop & Mobile"
          path: reports/*.xml
          reporter: java-junit    

      - name: Add Visual Summary
        if: always()
        run: |
          echo "## TEST AUTOMATION RESULTS" >> $GITHUB_STEP_SUMMARY
          
          if [ -d "errorShots" ] && [ "$(ls -A errorShots)" ]; then
            echo "### ❌ Status: FAILURES DETECTED" >> $GITHUB_STEP_SUMMARY
            echo "Review the screenshots in the **Artifacts** section at the bottom of this page." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ✅ Status: ALL PASSED" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "| Platform | Test Case Name | Duration | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|----------------|----------|--------|" >> $GITHUB_STEP_SUMMARY
          
          for file in reports/*.xml; do
            PLATFORM=$(basename "$file" | sed 's/results-//;s/.xml//')
            # Extraemos los casos de prueba y verificamos si tienen la etiqueta <failure>
            grep -e "<testcase" "$file" | while read -r line; do
              NAME=$(echo $line | sed -E 's/.*name="([^"]*)".*/\1/')
              TIME=$(echo $line | sed -E 's/.*time="([^"]*)".*/\1/')
              # Si la línea NO termina en '/>', significa que tiene un hijo (probablemente <failure>)
              if [[ "$line" != *"/>"* ]]; then
                STATUS="❌ Failed"
              else
                STATUS="✅ Passed"
              fi
              echo "| $PLATFORM | $NAME | ${TIME}s | $STATUS |" >> $GITHUB_STEP_SUMMARY
            done
          done