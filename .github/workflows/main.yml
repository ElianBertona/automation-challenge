name: End-to-End & Quality Suite

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  automation-suite:
    name: "Strangerlist Test Suite"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint . || echo "Lint errors found but continuing for testing"

      - name: Prepare Workspace
        run: |
          mkdir -p reports/junit-results
          mkdir -p errorShots
          chmod -R 777 reports/ errorShots/

      - name: Run E2E Tests
        run: |
          docker compose up --build --exit-code-from automation-tests
        env:
          SPEC_PATH: "./test/specs/e2e/**/*.js"

      - name: Run Performance Audit
        if: always()
        run: |
          docker compose run automation-tests npx wdio run wdio.conf.js --spec ./test/specs/performance/**/*.js
        continue-on-error: true

      - name: File Permissions
        if: always()
        run: sudo chmod -R 777 reports/ errorShots/ || true

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-execution-artifacts
          path: |
            reports/
            errorShots/

      - name: Extract Results from Docker
        if: always()
        run: |
          CONTAINER_ID=$(docker ps -a -q --filter "ancestor=automation-challenge-automation-tests" | head -n 1)
          if [ -z "$CONTAINER_ID" ]; then CONTAINER_ID=$(docker ps -a -q | head -n 1); fi
          
          echo "Extrayendo desde: $CONTAINER_ID"
          mkdir -p /tmp/docker_reports
          docker cp $CONTAINER_ID:/app/reports/. /tmp/docker_reports/
          sudo chown -R $USER:$USER /tmp/docker_reports/
          cp -r /tmp/docker_reports/* ./reports/ || true
          ls -R reports/junit-results/
        continue-on-error: true

      - name: 📊 Generate Integrated Quality Summary
        if: always()
        run: |
          cat << 'EOF' > temp_report.py
          import xml.etree.ElementTree as ET
          import os
          import re

          report_path = 'reports/junit-results'
          summary_file = os.environ.get('GITHUB_STEP_SUMMARY')
          
          tables = {'E2E_Desk': [], 'E2E_Mobi': [], 'Perf_Desk': [], 'Perf_Mobi': []}
          total_tests, passed_tests, total_duration = 0, 0, 0.0

          if os.path.exists(report_path):
              for file in [f for f in os.listdir(report_path) if f.endswith('.xml')]:
                  try:
                      is_mobi = 'Mobile' in file
                      is_perf = 'Perf' in file or 'performance' in file.lower()
                      key = ('Perf' if is_perf else 'E2E') + ('_Mobi' if is_mobi else '_Desk')
                      tree = ET.parse(os.path.join(report_path, file))
                      root = tree.getroot()
                      suites = root.findall('.//testsuite') if root.tag == 'testsuites' else [root]
                      
                      for suite in suites:
                          for tc in suite.findall('testcase'):
                              total_tests += 1
                              duration = float(tc.get('time', 0))
                              total_duration += duration
                              if tc.find('failure') is None: passed_tests += 1
                              
                              name = tc.get('name', '')
                              system_out = tc.find('system-out')
                              logs = system_out.text if system_out is not None else ''
                              
                              status = '✅ Pass' if tc.find('failure') is None else '❌ Fail'
                              tables[key].append({'name': name, 'time': f'{duration:.2f}s', 'status': status, 'logs': logs})
                  except: pass

          success_rate = (passed_tests / total_tests * 100) if total_tests > 0 else 0

          with open(summary_file, 'a') as f:
              f.write('# 🚀 QA ENGINEERING DASHBOARD\n\n')
              f.write('## 📈 System Health & DORA Metrics\n')
              f.write('| KPI | Value | Status |\n| :--- | :--- | :--- |\n')
              f.write(f'| **Quality Gate** | {success_rate:.1f}% | {"🟢 Healthy" if success_rate > 95 else "🔴 Risk"} |\n')
              f.write(f'| **Cycle Time** | {total_duration:.2f}s | {"⚡ Optimized" if total_duration < 120 else "🕒 Warning"} |\n')
              f.write(f'| **Reliability Index** | {passed_tests}/{total_tests} Passed | {"🛡️ Stable" if success_rate == 100 else "⚠️ Unstable"} |\n')
              f.write(f'| **Readiness** | Ready for Release | {"🚀 APPROVED" if success_rate == 100 else "🛑 BLOCKED"} |\n\n')

              for label, k in [('💻 DESKTOP E2E', 'E2E_Desk'), ('📱 MOBILE E2E', 'E2E_Mobi'), ('🚀 PERFORMANCE', 'Perf_Desk')]:
                  if tables[k]:
                      f.write(f'### {label}\n| Test Case | Time | Status |\n| :--- | :--- | :--- |\n')
                      for r in tables[k]: f.write(f'| {r["name"]} | {r["time"]} | {r["status"]} |\n')
                      f.write('\n')

              f.write('## 🔬 Performance Deep Dive\n<details><summary>Click to view Core Web Vitals</summary>\n\n')
              found = False
              # Buscamos en TODOS los logs de todas las tablas por si acaso
              for cat in tables.values():
                  for item in cat:
                      # Buscamos patrones de métricas (LCP, TBT, CLS o Score)
                      metrics = re.findall(r'(LCP:.*|TBT:.*|CLS:.*|SCORE:.*)', item['logs'], re.IGNORECASE)
                      if metrics:
                          found = True
                          f.write(f'#### Results from {item["name"]}\n```text\n' + '\n'.join(metrics) + '\n```\n')
              if not found: f.write('*No se detectaron métricas en el system-out de los XML.*\n')
              f.write('</details>\n')
          EOF
          python3 temp_report.py
        continue-on-error: true